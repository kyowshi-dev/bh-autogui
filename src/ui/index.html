<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Bit Heroes Surface Selector</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand" aria-label="Bit Heroes Surface Selector">
        <div class="brand-mark" aria-hidden="true">BH</div>
        <div class="brand-copy">
          <strong>Bit Heroes</strong>
          <span>Surface selector</span>
        </div>
      </div>

      <div class="page-context">
        <span class="eyebrow">KONGREGATE / 266462</span>
        <span class="page-url">juppiomenz / bit-heroes</span>
      </div>

      <div class="toolbar-actions">
        <button
          id="select-button"
          class="button button-select"
          type="button"
          aria-pressed="false"
        >
          <span class="button-symbol" aria-hidden="true">+</span>
          Select surface
        </button>
        <button
          id="confirm-button"
          class="button button-confirm"
          type="button"
          disabled
        >
          <span class="button-symbol" aria-hidden="true">&#10003;</span>
          Confirm
        </button>
        <button
          id="toolbar-toggle"
          class="button button-reset button-toggle"
          type="button"
          aria-label="Hide header"
          aria-expanded="true"
          aria-controls="toolbar-content"
          title="Hide header"
        >
          <span aria-hidden="true">&#8963;</span>
        </button>
      </div>

      <div id="toolbar-content" class="toolbar-content">
      <div class="status-row" aria-live="polite">
        <span
          id="status-indicator"
          class="status-indicator"
          data-state="loading"
        ></span>
        <span id="status-label">Opening Kongregate…</span>
        <span class="status-divider"></span>
        <span id="status-detail">Waiting for game surface</span>
      </div>
      <section class="ocr-controls" aria-label="OCR monitor">
        <div class="ocr-heading">
          <strong>OCR monitor</strong>
          <span id="ocr-state">Stopped</span>
        </div>
        <label class="ocr-field interval-field">
          <span>Interval</span>
          <span class="input-with-unit">
            <input id="ocr-interval" type="number" min="1000" max="10000" step="500" value="2000" />
            <span>ms</span>
          </span>
        </label>
        <label class="ocr-field keyword-field">
          <span>Watch for</span>
          <input id="ocr-keywords" type="text" placeholder="cleared, defeat, rerun" />
        </label>
        <div class="ocr-actions">
          <button id="ocr-start" class="button button-confirm" type="button" disabled>Start OCR</button>
          <button id="ocr-stop" class="button button-reset" type="button" aria-label="Stop OCR" title="Stop OCR" disabled>&#9632;</button>
        </div>
        <output id="ocr-result" class="ocr-result" aria-live="polite">Select the verified game surface to enable OCR.</output>
      </section>
      </div>
    </header>
    <script type="module" src="./app.js"></script>
  </body>
</html>
